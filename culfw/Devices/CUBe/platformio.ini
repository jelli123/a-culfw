; -----------------------------------------------------------------------------
; DEVICE: CUBe (eQ-3 MAX! Cube, AT91SAM7X256, CC1101, DM9161 Ethernet)
; -----------------------------------------------------------------------------
; PlatformIO has no AT91SAM7 platform: ststm32 supplies the arm-none-eabi
; toolchain, boards/cube.json the ARM7TDMI, scripts/at91sam7.py strips the
; Cortex-M flags ststm32 adds. Sources and flags follow Devices/CUBe/Makefile
; and the Make.conf files it walks (at91lib, at91lib/usb, at91lib/avr, avr-uip).
;
; Both environments are the _BL images 'make all' builds: linked to 0x104000,
; behind the USB mass storage bootloader (Devices/CUBe/bootloader). Copy
; CUBE_BL.bin / CUBEx4_BL.bin onto the drive it presents.
[env:CUBE_BL]
platform = ststm32
board = cube
board_build.ldscript = Devices/CUBe/CUBE_BL_flash.lds
; overrides the atmelavr toolchain pin from [env]
platform_packages =
upload_protocol = mbed

extra_scripts =
    ${env.extra_scripts}
    pre:scripts/at91sam7.py

build_flags =
    -D${this.__env__}
    -DAT91SAM7X256
    -Dflash
    -DTRACE_LEVEL=4
    -DDBGU_UNIT_IN
    -Os
    -fno-isolate-erroneous-paths-dereference
    -mlong-calls
    -ffunction-sections
    -std=c99
    -g
    -Wall
    -Wno-strict-aliasing
    -Wno-unused-but-set-variable
    ; as ../modern-gcc.mk
    -fcommon
    -Wno-error=implicit-function-declaration

    -I Devices/CUBe
    -I .
    -I at91lib
    -I at91lib/usb
    -I clib
    -I at91lib/avr
    -I avr-uip/uip
    -I avr-uip

build_src_filter =
    -<*>
    +<at91lib/board_cstartup.S>

    ; Devices/CUBe/Make.conf
    +<Devices/CUBe/main.c>
