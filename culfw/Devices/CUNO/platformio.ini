; -----------------------------------------------------------------------------
; DEVICE: CUNO (ATmega644P, CC1101, ENC28J60 Ethernet)
; -----------------------------------------------------------------------------
; One image for 868 and 433 MHz: the band is chosen at runtime (fband.c), the
; makefile does not set a FREQUENCE either.
[env:CUNO]
board = ATmega644P
board_build.mcu = atmega644p
board_build.f_cpu = 8000000L
; The AVRProg bootloader (Devices/CUNO/Bootloader, BOOTSIZE=1024 words) takes
; the top 2048 bytes of the 64 KiB flash.
board_upload.maximum_size = 63488
board_upload.maximum_ram_size = 4096
upload_protocol = avr109

build_flags =
    ${env.build_flags}
    -I Devices/CUNO
    -I avr-uip
    -I avr-uip/uip
    ; as in the makefile: uIP's PT_YIELD_FLAG in pt.h
    -Wno-unused-but-set-variable

build_src_filter =
    -<*>
    +<Devices/CUNO/CUNO.c>
    +<clib/cc1100.c>
    +<clib/cc1101_pllcheck.c>
    +<clib/clock.c>
    +<clib/delay.c>
    +<clib/display.c>
    +<clib/stringfunc.c>
    +<clib/fncollection.c>
    +<clib/fband.c>
    +<clib/ringbuffer.c>
    +<clib/rf_send.c>
    +<clib/rf_asksin.c>
    +<clib/rf_receive.c>
    +<clib/rf_receive_bucket.c>
    +<clib/rf_receive_tcm97001.c>
    +<clib/rf_receive_it.c>
    +<clib/rf_receive_tx3.c>
    +<clib/rf_receive_revolt.c>
    +<clib/rf_receive_esa.c>
    +<clib/rf_receive_hms.c>
    +<clib/helper.c>
    +<clib/rf_router.c>
    +<clib/fht.c>
    +<clib/fastrf.c>
    +<clib/memory.c>
    +<clib/serial.c>
    +<clib/ttydata.c>
    +<clib/ethernet.c>
    +<clib/tcplink.c>
    +<clib/ntp.c>
    +<clib/spi.c>
    +<clib/twimaster.c>
    +<clib/onewire.c>
    +<clib/intertechno.c>
    +<clib/somfy_rts.c>

    ; uIP stack and the ENC28J60 driver
    +<avr-uip/drivers/ethersex/enc28j60.c>
    +<avr-uip/drivers/ethersex/network.c>
    +<avr-uip/uip/uip.c>
    +<avr-uip/uip/uip_arp.c>
    +<avr-uip/uip/uiplib.c>
    +<avr-uip/uip/psock.c>
    +<avr-uip/uip/timer.c>
    +<avr-uip/uip/uip-neighbor.c>
    +<avr-uip/apps/dhcpc/dhcpc.c>
