[platformio]
src_dir = .

default_envs = 
    CUL_V3
    nanoCUL868
    nanoCUL433
    CUNO

; Hier binden wir die Configs aus den Unterordnern ein
extra_configs =
    Devices/nanoCUL/platformio.ini
    Devices/CUL/platformio.ini
    Devices/MapleCUN/platformio.ini
    Devices/CUNO/platformio.ini

; --- GEMEINSAME BASIS (Global für alle) ---
[env]
platform = atmelavr
; avr-gcc 7.3.0. The newest AVR toolchain PlatformIO publishes; the makefiles
; use whatever avr-gcc is on the PATH (verified against 14.2.0). Measured
; against the previous pin of 5.4.0: CUL_V3 27354 instead of 27748 bytes of
; flash, nanoCUL868 14012 instead of 14410. Both smaller, which matters on
; CUL_V3 - it was at 96.8 % of its 28672 bytes.
platform_packages =
    toolchain-atmelavr@~3.70300.0

; Kopier-Skript einbinden
extra_scripts = 
    pre:scripts/increment_version.py
    post:scripts/collect_binaries.py

build_flags =
    -I clib
    -I .
    -Os
    -funsigned-char
    -funsigned-bitfields
    -ffunction-sections
    -fpack-struct
    -fshort-enums
    -mcall-prologues
    -finline-limit=20
    
    ; Standards & Warnungen
    -std=gnu99
    -fgnu89-inline
    -Wall
    -Wstrict-prototypes
    -Wundef
    
    ; Linker
    -Wl,--relax
    -Wl,--gc-sections
    
    ; Toleranz
    -Wno-strict-aliasing
    -Wno-unknown-pragmas
    -Wno-format
    -Wno-implicit-function-declaration

upload_speed = 38400
