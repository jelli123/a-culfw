name: Build Firmware

# Build on pushes to master/main and on pull requests against them.
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      # default_envs = the three AVR targets. They build on any host.
      - name: Build AVR targets
        run: |
          cd culfw
          pio run

      # MapleCUN and CUBe are not in default_envs on purpose: PlatformIO cannot resolve
      # the ARM toolchain for the ststm32 platform on linux_aarch64, so a
      # default build would break on an arm64 workstation. The runner is
      # x86_64, so build it explicitly here.
      - name: Build MapleCUN, CUBe and SBU targets
        run: |
          cd culfw
          pio run -e MapleCUNx4_W5100_BL -e MapleCUNx4_W5500_BL -e CUL_V3_SBU \
                  -e CUBE_BL -e CUBEx4_BL

      # collect_binaries.py copies every built image into binaries/ and writes
      # manifest.json. Uploading culfw/Devices/**/*.hex instead would only pick
      # up the three committed Optiboot images and never the firmware.
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: a-culfw-${{ github.run_number }}
          path: |
            binaries/*.hex
            binaries/*.bin
            binaries/manifest.json
          if-no-files-found: error

  # The PlatformIO job above covers six devices. Everything else in
  # culfw/Devices/ is built only by its own makefile, and nothing checked those
  # for years — long enough for CUNO to end up 300 bytes over its RAM without
  # anyone noticing. This job builds every one of them on every push.
  #
  # Covers the ARM devices too (CUBe, CUL-HM-CFG, MapleCUN).
  make-devices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc gcc-arm-none-eabi
          avr-gcc --version | head -1
          arm-none-eabi-gcc --version | head -1

      - name: Build every device from its makefile
        run: |
          cd culfw/Devices
          fail=""
          for d in */; do
            n="${d%/}"
            [ -f "$n/makefile" ] || [ -f "$n/Makefile" ] || continue
            echo "::group::$n"
            if ( cd "$n" && make all ); then echo "$n OK"; else echo "$n FAILED"; fail="$fail $n"; fi
            echo "::endgroup::"
          done
          if [ -n "$fail" ]; then echo "failed:$fail"; exit 1; fi
          echo "all devices built"
